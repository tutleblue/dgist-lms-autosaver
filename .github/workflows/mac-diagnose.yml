# 맥 LMS·메일 진단 — 이 브랜치로 묶은 맥 앱(M칩·인텔)을 실제 설치·업데이트 흐름대로 돌려 본다
#
# 왜 있나: 2026-10-22 사용자 신고 "맥 판에서 LMS·메일 연동이 안 된다". 개발 PC 에 맥이 없어 여기서 잰다.
# 첫 실행(릴리스 v1.12.34 그대로, 실행 39707720717)에서 원인을 찾았다: 새로 깐 맥은 모두 되는데, 업데이트한 새 판은
# 창·서버가 뜨기 전에 키체인 암호 창에서 멈췄다(옛 판이 만든 키체인 항목을 새 판이 허락 없이 못 읽음).
# 이제는 고친 것을 잰다 — 이 브랜치를 mac.yml 로 묶은 DMG 로:
#  A. 새로 깐 맥: 설정 저장 → 키체인 → 껐다 켜기 → 메일 새로고침 → 빠른 동기화 (크로미움·작업 프로세스의 비밀번호)
#  B. 넘겨주기 없이 업데이트한 맥 (DMG 로 다시 깔기 등): 최신 릴리스로 설정 저장 → 이 빌드를 덮어 깔기
#     → 창·서버가 먼저 뜨나 → 허락을 기다리는 동안 메일·LMS 를 안 하나 → 거부하면 까닭을 말하나
#     → 비밀번호를 다시 저장하면 맥 로그인 암호 없이 되살아나나
#  (앱 안 업데이트의 넘겨주기는 mac.yml '키체인 넘겨주기 점검' 이 잰다)
# 진짜 학교 서버에는 아무것도 보내지 않는다 — 계정은 가짜, 메일 서버는 127.0.0.1(닫힌 포트), LMS 는 fake_lms.py,
# 켜기 전에 설정에 가짜 주소를 넣고 부르기 직전마다 다시 확인한다(lib.sh guard_fake_targets).
name: mac-diagnose

on:
  push:
    branches: ["diag/mac-lms-mail"]
  workflow_dispatch:
    inputs:
      previous:
        description: "업데이트 흉내에서 먼저 깔 릴리스 (비우면 최신)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mac-diagnose-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # 이 브랜치를 묶는다 (넘겨주기 점검·실제 앱 띄우기·smoke 포함). 불리는 쪽은 부르는 쪽이 준 권한까지만 쓴다
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/mac.yml
    secrets: inherit

  diagnose:
    name: diagnose (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      ARCH: ${{ matrix.arch }}
      REPO: tutleblue/dgist-lms-autosaver
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: daling-mac-dmg-${{ matrix.arch }}
          path: ${{ runner.temp }}/new

      - name: 볼 판 정하기
        id: ver
        run: |
          PREV="${{ inputs.previous }}"
          [ -n "$PREV" ] || PREV="$(curl -fsSIL -o /dev/null -w '%{url_effective}' "https://github.com/$REPO/releases/latest" | sed 's#.*/tag/##')"
          NEW_DMG="$(ls "$RUNNER_TEMP"/new/daling-*-mac-$ARCH.dmg | head -1)"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new_dmg=$NEW_DMG" >> "$GITHUB_OUTPUT"
          echo "이 브랜치 DMG ${NEW_DMG##*/} · 이전 판 $PREV · $ARCH · macOS $(sw_vers -productVersion)"
          { echo "### 맥 LMS·메일 진단 ($ARCH, macOS $(sw_vers -productVersion), 이 브랜치 ${NEW_DMG##*/}, 이전 판 $PREV)"
            echo "| 장면 | 항목 | 결과 |"; echo "|---|---|---|"; } > "$RUNNER_TEMP/head.md"

      - name: 임시 키체인을 기본으로 (러너의 로그인 키체인은 잠겨 있을 수 있다)
        run: |
          KC=daling-diag.keychain
          security create-keychain -p diag "$KC"
          security set-keychain-settings "$KC"   # 자동 잠금 끄기
          security unlock-keychain -p diag "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KC"

      - name: 가짜 LMS 띄우기 (127.0.0.1:8899)
        run: |
          mkdir -p logs
          nohup python3 .github/diag/fake_lms.py 8899 diag-user diag-lms-pass-1 "$PWD/logs/fake-lms.json" > logs/fake-lms.log 2>&1 &
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8899/login && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8899/login | grep -q 'Login ID'

      - name: A. 새로 깐 맥 — 설치·설정 저장·껐다 켜기
        run: |
          . .github/diag/lib.sh
          install_dmg "${{ steps.ver.outputs.new_dmg }}"
          preseed_config
          start_app A
          save_settings
          guard_fake_targets
          $API markers "$DATA/config.json" | tee "$LOGS/A-markers.txt"
          if grep -q '평문' "$LOGS/A-markers.txt"; then verdict A "설정 저장" "❌ 비밀번호가 config.json 에 평문 (키체인에 못 넣음)"
          else verdict A "설정 저장" "✅ 비밀번호는 키체인에, config.json 에는 표시만"; fi
          # 껐다 켠다: 저장할 때 들고 있던 비밀번호(메모리) 말고 키체인에서 다시 읽게 — 사용자가 다음 날 켤 때와 같다
          stop_app
          start_app A

      - name: A. 메일 새로고침 (메일 서버 127.0.0.1)
        timeout-minutes: 5
        run: |
          . .github/diag/lib.sh
          mail_check A 30

      - name: A. 빠른 동기화 (가짜 LMS, 처음엔 크로미움을 받는다)
        timeout-minutes: 20
        run: |
          . .github/diag/lib.sh
          lms_check A

      - name: B. 넘겨주기 없이 업데이트 — 창이 먼저 뜨나, 기다리는 동안·거부 뒤·다시 저장 뒤
        # 키체인 묻는 창은 아무도 누르지 않는다(러너). 기다리는 동안을 재고, SecurityAgent 를 꺼 '거부' 를 흉내 낸다
        timeout-minutes: 25
        run: |
          . .github/diag/lib.sh
          stop_app
          rm -rf "$DATA"
          security delete-generic-password -s Daling -a settings > /dev/null 2>&1 || true
          install_release "${{ steps.ver.outputs.prev }}"
          preseed_config
          start_app B-old
          save_settings
          guard_fake_targets
          stop_app
          install_dmg "${{ steps.ver.outputs.new_dmg }}"

          if start_app B; then
            verdict B "새 판 켜기" "✅ 창·화면 서버가 먼저 뜸 (키체인은 창이 뜬 뒤 물음)"
          else
            verdict B "새 판 켜기" "❌ 60초 안에 화면 서버가 안 뜸 (화면: B-start-stuck.png)"
            exit 0
          fi
          sleep 6
          screencapture -x "$LOGS/B-after-window.png" 2>/dev/null || true
          H="$($API health)"; echo "건강: $H" | tee "$LOGS/B-health-waiting.txt"
          case "$H" in
            waiting*) verdict B "허락 기다리는 동안 알림" "✅ ${H#*| }" ;;
            *) verdict B "허락 기다리는 동안 알림" "❌ $H (화면: B-after-window.png)" ;;
          esac
          mail_probe B-wait 20
          [ "$MAIL_RESULT" = keychain-message ] \
            && verdict B "기다리는 동안 메일 새로고침" "✅ 시작하지 않고 키체인 안내 — ${MAIL_TEXT#HTTP * }" \
            || verdict B "기다리는 동안 메일 새로고침" "❌ $MAIL_RESULT — $MAIL_TEXT"

          # '거부' 흉내: 묻는 창(SecurityAgent)을 끈다
          pkill -x SecurityAgent 2>/dev/null || sudo pkill -x SecurityAgent 2>/dev/null || true
          sleep 6
          screencapture -x "$LOGS/B-after-deny.png" 2>/dev/null || true
          H="$($API health)"; echo "건강: $H" | tee "$LOGS/B-health-denied.txt"
          case "$H" in
            denied*) verdict B "거부 뒤 알림" "✅ ${H#*| }" ;;
            *) verdict B "거부 뒤 알림" "❌ $H (화면: B-after-deny.png)" ;;
          esac
          mail_probe B-denied 20
          [ "$MAIL_RESULT" = keychain-message ] \
            && verdict B "거부 뒤 메일 새로고침" "✅ '계정을 먼저 입력' 대신 — ${MAIL_TEXT#HTTP * }" \
            || verdict B "거부 뒤 메일 새로고침" "❌ $MAIL_RESULT — $MAIL_TEXT"

          # 되살리기: 설정에서 비밀번호를 다시 저장 → 못 읽는 옛 항목을 묻지 않고 지우고 이 판의 항목을 만든다
          save_settings
          $API markers "$DATA/config.json" | tee "$LOGS/B-resaved-markers.txt"
          if grep -q '평문' "$LOGS/B-resaved-markers.txt"; then verdict B "비밀번호 다시 저장" "❌ 평문으로 남음 (키체인에 못 넣음)"
          else verdict B "비밀번호 다시 저장" "✅ 키체인에 다시 들어감 (맥 로그인 암호 없이)"; fi
          H="$($API health)"; echo "건강: $H" | tee "$LOGS/B-health-resaved.txt"
          case "$H" in none*) verdict B "다시 저장 뒤 알림" "✅ 키체인 알림 사라짐" ;; *) verdict B "다시 저장 뒤 알림" "❌ $H" ;; esac
          mail_probe B-resaved 30
          [ "$MAIL_RESULT" = refused ] \
            && verdict B "다시 저장 뒤 메일" "✅ 비밀번호를 읽고 서버에 붙으러 감 (닫힌 포트라 연결 거부)" \
            || verdict B "다시 저장 뒤 메일" "❌ $MAIL_RESULT — $MAIL_TEXT"
          lms_check B-resaved
          pkill -x SecurityAgent 2>/dev/null || sudo pkill -x SecurityAgent 2>/dev/null || true

      - name: 요약
        if: always()
        run: |
          cat "$RUNNER_TEMP/head.md" logs/verdicts.md 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$HOME/Library/Application Support/Daling/server_errors.log" logs/ 2>/dev/null || true
          pkill -f "/Applications/Daling.app/Contents/MacOS/Daling" || true
          # 판정에 ❌ 가 있으면 실패로 (요약 표를 보면 어디인지 바로 안다)
          ! grep -q '❌' logs/verdicts.md

      - name: 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-diagnose-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
