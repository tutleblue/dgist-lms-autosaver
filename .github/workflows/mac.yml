# Daling macOS(Apple Silicon) 빌드 — Daling.app 을 DMG 로
#
# 왜 CI 에서 만드나: 개발 PC 는 Windows 뿐이라 맥 앱은 GitHub 의 macos-latest(arm64)에서만 묶고 시험한다.
# 흐름: PyInstaller(packaging/mac/daling-mac.spec) → ad-hoc 서명 → 창 없는 점검(--autosaver-smoke)
#       → 실제 앱을 25초 띄워 화면 서버 응답·스크린샷 → DMG(daling-<버전>-mac-arm64.dmg) → 아티팩트
#  - build/mac 브랜치에 올리거나 Actions 탭에서 수동 실행(workflow_dispatch). 릴리스는 만들지 않는다.
#    (앱의 업데이트 확인 updater.py 는 GitHub 릴리스에 이 이름의 DMG 가 붙어 있어야 맥에 새 버전을 알린다)
#  - 서명은 ad-hoc 뿐이다. 공증(notarization)은 유료 Apple Developer 계정이 있어야 해서 하지 않는다.
#    그래서 받은 사람은 처음 한 번 '시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기' 를 눌러야 한다.
#
# 필요한 저장소 설정 (Settings → Secrets and variables → Actions, 없으면 빼고 빌드):
#  secrets.GOOGLE_CLIENT_JSON   google_client.json 내용 (데스크톱 OAuth 클라이언트)
#  secrets.DGIST_API_KEY        공공데이터포털 인증키 → public_data_key.txt
name: mac

on:
  push:
    branches: ["build/mac"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write           # 빌드 출처 증명(Sigstore) 인증서 받기
  attestations: write       # 빌드 출처 증명 저장
  artifact-metadata: write  # 증명과 이어지는 파일 기록 (actions/attest v4)

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # 명시하면 -eo pipefail 로 돈다. `점검 | tee 로그` 에서 점검이 실패하면 단계도 실패해야 한다
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-mac.txt

      - name: 패키지 설치
        run: |
          python -m pip install -r requirements-mac.txt
          python -c "import platform, sys; print(sys.version, platform.machine(), platform.mac_ver()[0])"

      - name: 빌드 준비물 (Google 클라이언트, 공공데이터 키)
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
          DGIST_API_KEY: ${{ secrets.DGIST_API_KEY }}
        run: |
          # release.yml 과 같은 규칙: 있으면 파일로 만들고(키는 앞뒤 공백 제거), 없으면 빼고 빌드한다
          python - <<'PY'
          import os, pathlib
          key = os.environ.get("DGIST_API_KEY", "").strip()
          if key:
              pathlib.Path("public_data_key.txt").write_text(key, encoding="utf-8")
          else:
              print("DGIST_API_KEY 없음 — 공공데이터 기본 키 없이 빌드")
          client = os.environ.get("GOOGLE_CLIENT_JSON", "")
          if client:
              pathlib.Path("google_client.json").write_text(client, encoding="utf-8")
          else:
              print("GOOGLE_CLIENT_JSON 없음 — 로그인 준비물 없이 빌드")
          PY

      - name: 버전
        id: ver
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dmg=daling-$v-mac-arm64.dmg" >> "$GITHUB_OUTPUT"
          echo "Daling $v"
          # 아이콘은 Windows 에서 `python scripts/make_icons.py --mac` 로 만들어 저장소에 둔다
          test -f packaging/mac/Daling.icns || echo "::warning::packaging/mac/Daling.icns 가 없어 기본 아이콘으로 묶습니다"

      - name: PyInstaller (dist/Daling.app)
        run: python -m PyInstaller packaging/mac/daling-mac.spec --noconfirm --clean

      - name: ad-hoc 서명
        run: |
          # Playwright 의 node 는 데이터 파일로 묶여 Contents/Resources 에 들어간다. 실행 권한이 없으면
          # LMS 로그인용 브라우저를 받지도 띄우지도 못한다 (browser_setup.py 도 한 번 더 확인한다)
          find dist/Daling.app/Contents -path "*/playwright/driver/node" -type f -exec chmod 755 {} +
          # PyInstaller 가 이미 ad-hoc 서명을 해 두지만, 위에서 손댄 뒤 앱 전체를 한 번에 다시 서명한다
          codesign --force --deep --sign - dist/Daling.app
          codesign --verify --deep --strict --verbose=2 dist/Daling.app
          codesign -dv dist/Daling.app 2>&1 | grep -E "Identifier|Signature|Format" || true
          du -sh dist/Daling.app

      - name: 실제 앱 띄워 보기 (최대 40초)
        timeout-minutes: 6
        run: |
          mkdir -p logs
          LOGS="$PWD/logs"
          APP="$PWD/dist/Daling.app"
          # 1차 빌드(2026-10-12)에서 'open' 으로 띄운 앱은 살아 있는데 화면 서버가 끝내 응답하지 않았고,
          # 화면에는 '로컬 네트워크의 기기 찾기 허용?' 창이 떠 있었다. 무엇에 걸려 멈췄는지 보려고
          # Finder 처럼 저장소가 아닌 폴더(/)에서 실행 파일을 바로 띄우고, 멈추면 파이썬·네이티브 스택을 남긴다.
          # 점검(smoke) 단계보다 먼저 돌린다: 그 창은 앱마다 한 번만 뜨므로, 진짜 앱이 띄우는지 따로 보려고.
          python -m pip install --quiet py-spy || true
          ( cd / && PYTHONFAULTHANDLER=1 "$APP/Contents/MacOS/Daling" > "$LOGS/app-stdout.log" 2> "$LOGS/app-stderr.log" ) &
          APP_PID=""
          PORT=""
          for i in $(seq 1 40); do
            sleep 1
            [ -n "$APP_PID" ] || APP_PID="$(pgrep -f "$APP/Contents/MacOS/Daling" | head -1 || true)"
            for p in $(seq 8765 8785); do
              if curl -fsS --max-time 1 "http://127.0.0.1:$p/healthz" -o "$LOGS/healthz.json" 2>/dev/null \
                 && grep -q '"mode"' "$LOGS/healthz.json"; then
                PORT=$p
                break
              fi
            done
            if [ -n "$PORT" ]; then echo "server up after ${i}s"; break; fi
          done
          echo "pid=${APP_PID:-없음}"
          echo "port=${PORT:-없음}"
          if [ -n "$APP_PID" ]; then
            lsof -nP -a -p "$APP_PID" -iTCP > "$LOGS/lsof-tcp.txt" 2>&1 || true
            sudo "$(python -c 'import shutil;print(shutil.which("py-spy") or "py-spy")')" dump --pid "$APP_PID" > "$LOGS/py-spy.txt" 2>&1 || true
            sample "$APP_PID" 2 -file "$LOGS/sample.txt" > /dev/null 2>&1 || true
            ps -o pid,ppid,stat,etime,command -p "$APP_PID" > "$LOGS/ps.txt" 2>&1 || true
            pgrep -lf Daling >> "$LOGS/ps.txt" 2>&1 || true
          fi
          INDEX_OK=0
          if [ -n "$PORT" ]; then
            curl -fsS --max-time 10 "http://127.0.0.1:$PORT/" -o logs/index.html && INDEX_OK=1
            curl -fsS --max-time 30 "http://127.0.0.1:$PORT/api/status" -o logs/status.json || true
          fi
          # 화면 기록 권한이 없으면 배경만 찍힌다. 그래도 창이 떴는지는 대강 보인다
          screencapture -x logs/screenshot.png || echo "::warning::스크린샷을 찍지 못했습니다"
          ALIVE=0
          [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null && ALIVE=1
          pkill -TERM -f "$APP/Contents/MacOS/Daling" || true
          for _ in $(seq 1 10); do pgrep -f "$APP/Contents/MacOS/Daling" > /dev/null || break; sleep 1; done
          pkill -KILL -f "$APP/Contents/MacOS/Daling" || true
          cp ~/.lms-autosaver/server_errors.log logs/ 2>/dev/null || true
          [ "$ALIVE" = 1 ] || { echo "::error::앱이 25초 안에 꺼졌거나 뜨지 않았습니다 (logs/app-stderr.log)"; exit 1; }
          [ -n "$PORT" ] || { echo "::error::앱의 화면 서버가 응답하지 않았습니다"; exit 1; }
          [ "$INDEX_OK" = 1 ] || { echo "::error::화면(/)을 받지 못했습니다"; exit 1; }

      - name: 창 없이 점검 (--autosaver-smoke)
        timeout-minutes: 5
        run: |
          mkdir -p logs
          # 사용자 데이터 대신 빈 임시 폴더로: 화면 서버·화면 파일·작업 프로세스·node·Cocoa 모듈·인증서·업데이트 도구 (smoke_test.py)
          # 앱이 직접 받은 파일에 격리 표시가 붙지 않는지도 본다 (지금 릴리스의 작은 .sha256 파일로. 없으면 건너뜀)
          REPO=tutleblue/dgist-lms-autosaver
          TAG="$(curl -fsSIL -o /dev/null -w '%{url_effective}' "https://github.com/$REPO/releases/latest" | sed 's#.*/tag/##')" || TAG=""
          URL="https://github.com/$REPO/releases/download/$TAG/daling-${TAG#v}-mac-arm64.dmg.sha256"
          if [ -n "$TAG" ] && curl -fsSIL -o /dev/null "$URL"; then export AUTOSAVER_SMOKE_DOWNLOAD_URL="$URL"; fi
          echo "AUTOSAVER_SMOKE_DOWNLOAD_URL=${AUTOSAVER_SMOKE_DOWNLOAD_URL:-없음}"
          dist/Daling.app/Contents/MacOS/Daling --autosaver-smoke 2>&1 | tee logs/smoke.log

      - name: 키체인 왕복 점검 (임시 키체인)
        # 러너의 로그인 키체인은 잠겨 있을 수 있다. 잠긴 키체인은 암호를 묻는 창을 띄우고 기다리느라 멈추므로
        # 빈 임시 키체인을 만들어 기본으로 둔다. 실제 사용자 환경과 달라 실패해도 DMG 는 만든다 (로그로 본다).
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p logs
          KC=daling-ci.keychain
          security create-keychain -p daling-ci "$KC"
          security set-keychain-settings "$KC"   # 자동 잠금 끄기
          security unlock-keychain -p daling-ci "$KC"
          OLD_DEFAULT="$(security default-keychain -d user | tr -d '" ')"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KC"
          set +e
          AUTOSAVER_SMOKE_KEYCHAIN=1 dist/Daling.app/Contents/MacOS/Daling --autosaver-smoke 2>&1 | tee logs/smoke-keychain.log
          rc=${PIPESTATUS[0]}
          set -e
          [ -n "$OLD_DEFAULT" ] && security default-keychain -d user -s "$OLD_DEFAULT" || true
          security delete-keychain "$KC" || true
          exit $rc

      - name: DMG 만들기
        run: |
          DMG="${{ steps.ver.outputs.dmg }}"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # ditto 는 심볼릭 링크(Frameworks↔Resources 교차 링크)·확장 속성·서명을 그대로 옮긴다
          ditto dist/Daling.app "$STAGE/Daling.app"
          # 열면 '응용 프로그램' 으로 끌어다 놓을 수 있게
          ln -s /Applications "$STAGE/Applications"
          # 러너에서 hdiutil 이 가끔 'Resource busy' 로 실패한다. 몇 번 다시 한다
          for i in 1 2 3; do
            hdiutil create -volname "Daling ${{ steps.ver.outputs.version }}" -srcfolder "$STAGE" \
              -fs HFS+ -format UDZO -ov "$DMG" && break
            echo "hdiutil create 실패 ($i) — 다시 합니다"
            sleep 5
          done
          test -f "$DMG"
          hdiutil verify "$DMG"
          # DMG 안의 앱 서명이 온전한지 한 번 더
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" > /dev/null
          codesign --verify --deep --strict "$MNT/Daling.app"
          hdiutil detach "$MNT" > /dev/null || hdiutil detach -force "$MNT" > /dev/null
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          ls -lh "$DMG"

      - name: 한 줄 설치·앱 안 업데이트 점검
        # 사이트의 'curl -fsSL https://gudaling.dev/install.sh | sh' 와 같은 docs/install.sh 로
        #  1) 지금 릴리스를 /Applications 에 깔고 (curl 은 격리 표시를 붙이지 않는다 → Gatekeeper 창 없음)
        #  2) 그 앱을 켜 둔 채, 앱 안 업데이트(updater._start_mac_install)가 넘기는 환경 변수 그대로 이번 빌드 DMG 로 바꾼다
        # 러너는 관리자 계정이라 /Applications 에 암호 없이 쓸 수 있다 (학생 맥 대부분과 같음)
        timeout-minutes: 10
        run: |
          mkdir -p logs
          APP=/Applications/Daling.app
          V="${{ steps.ver.outputs.version }}"
          health() {  # $1 초 안에 화면 서버가 뜨면 0
            for _ in $(seq 1 "$1"); do
              sleep 1
              for p in $(seq 8765 8785); do
                curl -fsS --max-time 1 "http://127.0.0.1:$p/healthz" 2>/dev/null | grep -q '"mode"' && { echo "port $p"; return 0; }
              done
            done
            return 1
          }
          no_quarantine() {
            if xattr -p com.apple.quarantine "$1" 2>/dev/null; then echo "::error::$1 에 격리 표시가 붙었습니다"; exit 1; fi
          }

          DALING_NO_OPEN=1 sh docs/install.sh 2>&1 | tee logs/install-oneline.log
          test -d "$APP"
          no_quarantine "$APP"
          no_quarantine "$APP/Contents/MacOS/Daling"
          codesign --verify --deep --strict "$APP"
          echo "깐 판: $(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)"
          # Finder 처럼 띄운다. 격리 표시가 없으니 Gatekeeper 창 없이 떠야 한다
          open "$APP"
          health 40 || { echo "::error::한 줄 설치한 앱이 뜨지 않았습니다"; exit 1; }

          cp "${{ steps.ver.outputs.dmg }}" "$RUNNER_TEMP/update.dmg"
          DALING_DMG="$RUNNER_TEMP/update.dmg" DALING_DEST=/Applications DALING_UPDATE=1             sh docs/install.sh 2>&1 | tee logs/install-update.log
          NEW="$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)"
          echo "바꾼 판: $NEW"
          [ "$NEW" = "$V" ] || { echo "::error::업데이트 뒤 판이 $NEW (기대 $V)"; exit 1; }
          test ! -e /Applications/.Daling.app.new && test ! -e /Applications/.Daling.app.old
          test ! -e "$RUNNER_TEMP/update.dmg"
          no_quarantine "$APP"
          codesign --verify --deep --strict "$APP"
          health 40 || { echo "::error::업데이트한 앱이 다시 뜨지 않았습니다"; exit 1; }
          pkill -f "Daling.app/Contents/MacOS/Daling" || true

      - name: 빌드 출처 증명 (Sigstore)
        # 맥 판은 공증이 없어(유료 Apple 개발자 계정 필요) 받은 DMG 가 진짜인지 macOS 가 확인해 주지 않는다.
        # 대신 '이 저장소의 이 워크플로가 만든 파일' 임을 공개 기록에 남긴다 (공개 저장소는 무료).
        # 확인: gh attestation verify daling-<버전>-mac-arm64.dmg -R tutleblue/dgist-lms-autosaver
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ver.outputs.dmg }}

      - name: DMG 보관
        uses: actions/upload-artifact@v4
        with:
          name: daling-mac-dmg
          path: |
            ${{ steps.ver.outputs.dmg }}
            ${{ steps.ver.outputs.dmg }}.sha256
          if-no-files-found: error

      - name: 로그·스크린샷 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daling-mac-logs
          path: |
            logs/
            build/daling-mac/warn-daling-mac.txt
          if-no-files-found: ignore
