# Daling macOS(Apple Silicon) 빌드 — Daling.app 을 DMG 로
#
# 왜 CI 에서 만드나: 개발 PC 는 Windows 뿐이라 맥 앱은 GitHub 의 macos-latest(arm64)에서만 묶고 시험한다.
# 흐름: PyInstaller(packaging/mac/daling-mac.spec) → 서명(사설 인증서, 없으면 ad-hoc) → 창 없는 점검(--autosaver-smoke)
#       → 실제 앱을 25초 띄워 화면 서버 응답·스크린샷 → DMG(daling-<버전>-mac-arm64.dmg) → 아티팩트
#  - build/mac 브랜치에 올리거나 Actions 탭에서 수동 실행(workflow_dispatch). 릴리스는 만들지 않는다.
#    (앱의 업데이트 확인 updater.py 는 GitHub 릴리스에 이 이름의 DMG 가 붙어 있어야 맥에 새 버전을 알린다)
#  - 서명: 오래 쓰는 사설 코드 서명 인증서 하나로 한다(packaging/mac/make_sign_cert.sh 로 한 번 만듦). 서명 요구
#    조건(DR)이 인증서에 묶여 새 판도 같은 조건을 만족한다 → DR 로 비교하는 개인정보 보호 권한(TCC)은 이어진다.
#    키체인은 아니다: 항목의 partition_id 가 'cdhash:<만든 빌드>' 라 업데이트 뒤 한 번 다시 묻는다(2026-10-15 실측,
#    '키체인 허락 유지 점검'). 비밀이 없으면 예전처럼 ad-hoc(DR 이 cdhash 라 빌드마다 바뀜).
#    공증(notarization)은 유료 Apple Developer 계정이 있어야 해서 하지 않는다 → 브라우저로 받은 DMG 는 처음 한 번
#    '시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기'. 한 줄 설치(docs/install.sh)는 격리 표시가 없어 이 창이 없다.
#
# 필요한 저장소 설정 (Settings → Secrets and variables → Actions, 없으면 빼고 빌드):
#  secrets.GOOGLE_CLIENT_JSON     google_client.json 내용 (데스크톱 OAuth 클라이언트)
#  secrets.DGIST_API_KEY          공공데이터포털 인증키 → public_data_key.txt
#  secrets.MAC_SIGN_P12_BASE64    서명 인증서 .p12 의 base64 (make_sign_cert.sh 가 만든 .base64.txt)
#  secrets.MAC_SIGN_P12_PASSWORD  그 .p12 의 암호 (.password.txt)
name: mac

on:
  push:
    branches: ["build/mac"]
  workflow_dispatch:
    inputs:
      test_cert:
        description: "서명 비밀이 없을 때, 이번 실행에서만 쓰고 버릴 인증서로 서명 길을 점검"
        type: boolean
        default: false
      keychain_lab:
        description: "키체인 실험: 다음 빌드가 묻지 않고 읽게 할 길을 여러 방법으로 잰다 (서명 인증서가 있어야 함, 몇 분 더 걸림)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write           # 빌드 출처 증명(Sigstore) 인증서 받기
  attestations: write       # 빌드 출처 증명 저장
  artifact-metadata: write  # 증명과 이어지는 파일 기록 (actions/attest v4)

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # 명시하면 -eo pipefail 로 돈다. `점검 | tee 로그` 에서 점검이 실패하면 단계도 실패해야 한다
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-mac.txt

      - name: 패키지 설치
        run: |
          python -m pip install -r requirements-mac.txt
          python -c "import platform, sys; print(sys.version, platform.machine(), platform.mac_ver()[0])"

      - name: 빌드 준비물 (Google 클라이언트, 공공데이터 키)
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
          DGIST_API_KEY: ${{ secrets.DGIST_API_KEY }}
        run: |
          # release.yml 과 같은 규칙: 있으면 파일로 만들고(키는 앞뒤 공백 제거), 없으면 빼고 빌드한다
          python - <<'PY'
          import os, pathlib
          key = os.environ.get("DGIST_API_KEY", "").strip()
          if key:
              pathlib.Path("public_data_key.txt").write_text(key, encoding="utf-8")
          else:
              print("DGIST_API_KEY 없음 — 공공데이터 기본 키 없이 빌드")
          client = os.environ.get("GOOGLE_CLIENT_JSON", "")
          if client:
              pathlib.Path("google_client.json").write_text(client, encoding="utf-8")
          else:
              print("GOOGLE_CLIENT_JSON 없음 — 로그인 준비물 없이 빌드")
          PY

      - name: 버전
        id: ver
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dmg=daling-$v-mac-arm64.dmg" >> "$GITHUB_OUTPUT"
          echo "Daling $v"
          # 아이콘은 Windows 에서 `python scripts/make_icons.py --mac` 로 만들어 저장소에 둔다
          test -f packaging/mac/Daling.icns || echo "::warning::packaging/mac/Daling.icns 가 없어 기본 아이콘으로 묶습니다"

      - name: PyInstaller (dist/Daling.app)
        run: python -m PyInstaller packaging/mac/daling-mac.spec --noconfirm --clean

      - name: 서명 인증서 준비 (있으면)
        id: cert
        env:
          MAC_SIGN_P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          TEST_CERT: ${{ inputs.test_cert }}
        run: |
          # ad-hoc 서명의 서명 요구 조건(DR)은 'cdhash H"…"' 라 빌드마다 바뀌고, macOS 는 TCC 권한·키체인 '믿는 앱' 을
          # 이 조건에 묶어 둔다 → 업데이트마다 다시 묻는다. 같은 인증서로 서명하면 DR 이 인증서 SHA-1 로 고정된다.
          # 다만 키체인 항목에는 partition_id(cdhash)가 따로 붙어 키체인은 여전히 다시 묻는다(실측, 아래 점검). Gatekeeper 와는 상관없다.
          P12="$RUNNER_TEMP/sign.p12"
          if [ -n "$MAC_SIGN_P12_BASE64" ]; then
            KIND="사설 인증서"
            # 붙여 넣을 때 섞인 줄바꿈·공백은 b64decode 가 버린다
            python -c 'import base64,os,sys; open(sys.argv[1],"wb").write(base64.b64decode(os.environ["MAC_SIGN_P12_BASE64"]))' "$P12"
            PASS="$(printf '%s' "$MAC_SIGN_P12_PASSWORD" | tr -d '\r\n')"
          elif [ "$TEST_CERT" = "true" ]; then
            KIND="시험용 인증서(이번 실행만)"
            # 사용자가 돌릴 스크립트 그대로, 사용자 PC(Git Bash)처럼 OpenSSL 3 으로. 없으면 시스템 LibreSSL
            OPENSSL="$(brew --prefix openssl@3 2>/dev/null || true)/bin/openssl"
            [ -x "$OPENSSL" ] || OPENSSL=/usr/bin/openssl
            "$OPENSSL" version
            OPENSSL="$OPENSSL" sh packaging/mac/make_sign_cert.sh "$RUNNER_TEMP/testcert"
            cp "$RUNNER_TEMP/testcert/daling-mac-sign.p12" "$P12"
            PASS="$(cat "$RUNNER_TEMP/testcert/daling-mac-sign.p12.password.txt")"
            echo "::add-mask::$PASS"
            rm -rf "$RUNNER_TEMP/testcert"
          else
            echo "MAC_SIGN_P12_BASE64 없음 — ad-hoc 서명 (업데이트마다 키체인·권한을 다시 묻는 판)"
            { echo "identity=-"; echo "kind=ad-hoc"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 서명 전용 임시 키체인 (끝에 '서명 키체인 지우기' 가 지운다)
          KC="$RUNNER_TEMP/daling-sign.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings "$KC"   # 자동 잠금 끄기 ('키체인 허락 유지 점검' 도 이 키로 다시 서명한다)
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -f pkcs12 -P "$PASS" -T /usr/bin/codesign \
            || { rm -f "$P12"; echo "::error::.p12 를 키체인에 넣지 못했습니다 (MAC_SIGN_P12_PASSWORD·base64 확인)"; exit 1; }
          rm -f "$P12"
          # codesign 이 개인 키를 쓸 때 묻는 창이 뜨지 않게 (macOS 10.12+ 키 partition list)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # 사설 인증서는 시스템이 믿지 않아 'valid identities' 에는 안 나온다(CSSMERR_TP_NOT_TRUSTED). 서명에는 문제없다
          security find-identity -p codesigning "$KC"
          ID="$(security find-identity -p codesigning "$KC" | awk '/^ *1\) /{print $2; exit}')"
          # 정책 필터가 믿지 않는 인증서를 빼는 판이 있으면 필터 없이 한 번 더 (codesign 은 SHA-1 로 찾는다)
          [ -n "$ID" ] || ID="$(security find-identity "$KC" | awk '/^ *1\) /{print $2; exit}')"
          [ -n "$ID" ] || { echo "::error::.p12 에 코드 서명용 인증서·개인 키가 없습니다"; exit 1; }
          { echo "identity=$ID"; echo "keychain=$KC"; echo "kind=$KIND"; } >> "$GITHUB_OUTPUT"
          echo "서명: $KIND · SHA-1 $ID"

      - name: 서명
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          SIGN_KC: ${{ steps.cert.outputs.keychain }}
          KIND: ${{ steps.cert.outputs.kind }}
        run: |
          # Playwright 의 node 는 데이터 파일로 묶여 Contents/Resources 에 들어간다. 실행 권한이 없으면
          # LMS 로그인용 브라우저를 받지도 띄우지도 못한다 (browser_setup.py 도 한 번 더 확인한다)
          find dist/Daling.app/Contents -path "*/playwright/driver/node" -type f -exec chmod 755 {} +
          # PyInstaller 가 이미 ad-hoc 서명을 해 두지만, 위에서 손댄 뒤 앱 전체를 한 번에 다시 서명한다.
          # --timestamp=none: 애플 시간 도장은 애플 인증서에만 쓸모 있고, 사설 인증서로는 네트워크만 타다 실패할 수 있다.
          # 강화 런타임(--options runtime)은 켜지 않는다: 공증용이고, 묶은 파이썬에 예외 권한이 따로 필요해진다.
          KC_ARGS=()
          if [ -n "$SIGN_KC" ]; then KC_ARGS=(--keychain "$SIGN_KC"); fi
          codesign --force --deep --timestamp=none "${KC_ARGS[@]}" --sign "$IDENTITY" dist/Daling.app
          codesign --verify --deep --strict --verbose=2 dist/Daling.app
          codesign -dv dist/Daling.app 2>&1 | grep -E "Identifier|Signature|Format|Authority|CDHash=" || true
          # 키체인 허락·TCC 권한이 묶이는 조건. ad-hoc 은 cdhash(빌드마다 바뀜), 사설 인증서면 인증서 SHA-1 이 들어가
          # 다음 빌드도 같은 조건을 만족한다. (암묵 DR 은 '# designated =>' 로 찍힌다)
          DR="$(codesign -d -r- dist/Daling.app 2>&1 | sed -n 's/^#* *designated => //p')"
          echo "designated requirement: $DR"
          if [ "$IDENTITY" = "-" ]; then
            case "$DR" in cdhash*) ;; *) echo "::warning::ad-hoc 인데 DR 이 cdhash 가 아닙니다: $DR" ;; esac
          else
            BID="$(plutil -extract CFBundleIdentifier raw dist/Daling.app/Contents/Info.plist)"
            echo "$DR" | grep -Eiq "^identifier \"$BID\" and certificate (leaf|root) = H\"$IDENTITY\"$" \
              || { echo "::error::DR 이 인증서에 묶이지 않았습니다: $DR (기대: identifier \"$BID\" and certificate … = H\"$IDENTITY\")"; exit 1; }
          fi
          echo "- 서명: $KIND · DR \`$DR\`" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/Daling.app

      - name: 실제 앱 띄워 보기 (최대 40초)
        timeout-minutes: 6
        run: |
          mkdir -p logs
          LOGS="$PWD/logs"
          APP="$PWD/dist/Daling.app"
          # 1차 빌드(2026-10-12)에서 'open' 으로 띄운 앱은 살아 있는데 화면 서버가 끝내 응답하지 않았고,
          # 화면에는 '로컬 네트워크의 기기 찾기 허용?' 창이 떠 있었다. 무엇에 걸려 멈췄는지 보려고
          # Finder 처럼 저장소가 아닌 폴더(/)에서 실행 파일을 바로 띄우고, 멈추면 파이썬·네이티브 스택을 남긴다.
          # 점검(smoke) 단계보다 먼저 돌린다: 그 창은 앱마다 한 번만 뜨므로, 진짜 앱이 띄우는지 따로 보려고.
          python -m pip install --quiet py-spy || true
          ( cd / && PYTHONFAULTHANDLER=1 "$APP/Contents/MacOS/Daling" > "$LOGS/app-stdout.log" 2> "$LOGS/app-stderr.log" ) &
          APP_PID=""
          PORT=""
          for i in $(seq 1 40); do
            sleep 1
            [ -n "$APP_PID" ] || APP_PID="$(pgrep -f "$APP/Contents/MacOS/Daling" | head -1 || true)"
            for p in $(seq 8765 8785); do
              if curl -fsS --max-time 1 "http://127.0.0.1:$p/healthz" -o "$LOGS/healthz.json" 2>/dev/null \
                 && grep -q '"mode"' "$LOGS/healthz.json"; then
                PORT=$p
                break
              fi
            done
            if [ -n "$PORT" ]; then echo "server up after ${i}s"; break; fi
          done
          echo "pid=${APP_PID:-없음}"
          echo "port=${PORT:-없음}"
          if [ -n "$APP_PID" ]; then
            lsof -nP -a -p "$APP_PID" -iTCP > "$LOGS/lsof-tcp.txt" 2>&1 || true
            sudo "$(python -c 'import shutil;print(shutil.which("py-spy") or "py-spy")')" dump --pid "$APP_PID" > "$LOGS/py-spy.txt" 2>&1 || true
            sample "$APP_PID" 2 -file "$LOGS/sample.txt" > /dev/null 2>&1 || true
            ps -o pid,ppid,stat,etime,command -p "$APP_PID" > "$LOGS/ps.txt" 2>&1 || true
            pgrep -lf Daling >> "$LOGS/ps.txt" 2>&1 || true
          fi
          INDEX_OK=0
          if [ -n "$PORT" ]; then
            curl -fsS --max-time 10 "http://127.0.0.1:$PORT/" -o logs/index.html && INDEX_OK=1
            curl -fsS --max-time 30 "http://127.0.0.1:$PORT/api/status" -o logs/status.json || true
          fi
          # 화면 기록 권한이 없으면 배경만 찍힌다. 그래도 창이 떴는지는 대강 보인다
          screencapture -x logs/screenshot.png || echo "::warning::스크린샷을 찍지 못했습니다"
          ALIVE=0
          [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null && ALIVE=1
          pkill -TERM -f "$APP/Contents/MacOS/Daling" || true
          for _ in $(seq 1 10); do pgrep -f "$APP/Contents/MacOS/Daling" > /dev/null || break; sleep 1; done
          pkill -KILL -f "$APP/Contents/MacOS/Daling" || true
          cp ~/.lms-autosaver/server_errors.log logs/ 2>/dev/null || true
          [ "$ALIVE" = 1 ] || { echo "::error::앱이 25초 안에 꺼졌거나 뜨지 않았습니다 (logs/app-stderr.log)"; exit 1; }
          [ -n "$PORT" ] || { echo "::error::앱의 화면 서버가 응답하지 않았습니다"; exit 1; }
          [ "$INDEX_OK" = 1 ] || { echo "::error::화면(/)을 받지 못했습니다"; exit 1; }

      - name: 창 없이 점검 (--autosaver-smoke)
        timeout-minutes: 5
        run: |
          mkdir -p logs
          # 사용자 데이터 대신 빈 임시 폴더로: 화면 서버·화면 파일·작업 프로세스·node·Cocoa 모듈·인증서·업데이트 도구 (smoke_test.py)
          # 앱이 직접 받은 파일에 격리 표시가 붙지 않는지도 본다 (지금 릴리스의 작은 .sha256 파일로. 없으면 건너뜀)
          REPO=tutleblue/dgist-lms-autosaver
          TAG="$(curl -fsSIL -o /dev/null -w '%{url_effective}' "https://github.com/$REPO/releases/latest" | sed 's#.*/tag/##')" || TAG=""
          URL="https://github.com/$REPO/releases/download/$TAG/daling-${TAG#v}-mac-arm64.dmg.sha256"
          if [ -n "$TAG" ] && curl -fsSIL -o /dev/null "$URL"; then export AUTOSAVER_SMOKE_DOWNLOAD_URL="$URL"; fi
          echo "AUTOSAVER_SMOKE_DOWNLOAD_URL=${AUTOSAVER_SMOKE_DOWNLOAD_URL:-없음}"
          dist/Daling.app/Contents/MacOS/Daling --autosaver-smoke 2>&1 | tee logs/smoke.log

      - name: 키체인 왕복 점검 (임시 키체인)
        # 러너의 로그인 키체인은 잠겨 있을 수 있다. 잠긴 키체인은 암호를 묻는 창을 띄우고 기다리느라 멈추므로
        # 빈 임시 키체인을 만들어 기본으로 둔다. 실제 사용자 환경과 달라 실패해도 DMG 는 만든다 (로그로 본다).
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p logs
          KC=daling-ci.keychain
          security create-keychain -p daling-ci "$KC"
          security set-keychain-settings "$KC"   # 자동 잠금 끄기
          security unlock-keychain -p daling-ci "$KC"
          OLD_DEFAULT="$(security default-keychain -d user | tr -d '" ')"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KC"
          set +e
          AUTOSAVER_SMOKE_KEYCHAIN=1 dist/Daling.app/Contents/MacOS/Daling --autosaver-smoke 2>&1 | tee logs/smoke-keychain.log
          rc=${PIPESTATUS[0]}
          set -e
          [ -n "$OLD_DEFAULT" ] && security default-keychain -d user -s "$OLD_DEFAULT" || true
          security delete-keychain "$KC" || true
          exit $rc

      - name: 키체인 허락 유지 점검 (다음 빌드 흉내)
        # 새 판을 깔아도 키체인 허락을 다시 묻지 않는지 잰다. 이번 빌드(A)로 점검 항목을 남기고, 같은 자리에
        # '다음 빌드'(B: 판 번호만 바꿔 같은 신원으로 다시 서명 → cdhash 는 다름)를 놓은 뒤 묻는 창 없이 읽어 본다.
        #  - 양성 대조군 same: A 가 쓰고 A 가 그대로 읽는다 → 읽어야 정상 (묻는 창을 막은 읽기 자체가 되는지)
        #  - 음성 대조군 ad-hoc: B 가 못 읽어야 정상 (이 점검이 '다시 묻기' 를 잡는다는 증거)
        #  - 사설 인증서: 2026-10-15 실측(실행 38617564695) — B 도 못 읽는다(-25293). 항목의 '믿는 앱' 은 인증서 DR 로
        #    묶이지만(identifier … and certificate root = H"…"), 따로 붙는 partition_id 가 'cdhash:<만든 빌드>' 라서다.
        #    애플 팀 ID 가 없는 서명은 partition 이 cdhash 뿐이다 (애플 포럼 developer.apple.com/forums/thread/98484 와 같음).
        #    그래서 사설 인증서 결과는 알림으로만 남기고, 읽게 되면(달라지면) 알린다. 양성 대조군이 깨지면 실패.
        # 러너의 임시 키체인은 사용자 로그인 키체인과 다를 수 있어, 실패해도 DMG 는 만든다 (단계 요약·로그로 본다).
        continue-on-error: true
        timeout-minutes: 10
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          SIGN_KC: ${{ steps.cert.outputs.keychain }}
        run: |
          set +e
          mkdir -p logs
          LOG="$PWD/logs/keychain-persist.log"
          : > "$LOG"
          OLD_DEFAULT="$(security default-keychain -d user | tr -d '" ')"
          SEARCH="$(security list-keychains -d user | tr -d '"')"
          limited() {  # $1 초 안에 안 끝나면 죽이고 124 (묻는 창을 기다리며 멈출 때 대비)
            local limit=$1 pid
            shift
            "$@" >> "$LOG" 2>&1 &
            pid=$!
            for _ in $(seq 1 "$limit"); do
              kill -0 "$pid" 2>/dev/null || { wait "$pid"; return $?; }
              sleep 1
            done
            kill -KILL "$pid" 2>/dev/null
            wait "$pid" 2>/dev/null
            return 124
          }
          cdhash() { codesign -dvvv "$1" 2>&1 | sed -n 's/^CDHash=//p'; }
          dreq() { codesign -d -r- "$1" 2>&1 | sed -n 's/^#* *designated => //p'; }
          persist() {  # $1 이름, $2 서명 신원('-' = ad-hoc), $3 next(다음 빌드로 바꿔 읽기)|same(그대로 읽기)
            # 0 = 묻지 않고 읽음, 1 = 못 읽음(다시 물어야 함)
            local name=$1 id=$2 mode=$3 kc="daling-persist-$1.keychain" app="$RUNNER_TEMP/kc-$1/Daling.app" rc cd_a cd_b dr_a dr_b
            local kc_args=()
            if [ "$id" != "-" ] && [ -n "$SIGN_KC" ]; then kc_args=(--keychain "$SIGN_KC"); fi
            rm -rf "$RUNNER_TEMP/kc-$name" && mkdir -p "$RUNNER_TEMP/kc-$name" && ditto dist/Daling.app "$app" || return 2
            if [ "$id" != "$IDENTITY" ]; then  # 대조군: 바깥 번들만 ad-hoc 으로 다시 서명 (주 실행 파일의 신원이 바뀐다)
              codesign --force --timestamp=none "${kc_args[@]}" --sign "$id" "$app" >> "$LOG" 2>&1 || return 2
            fi
            security create-keychain -p daling-ci "$kc" && security set-keychain-settings "$kc" \
              && security unlock-keychain -p daling-ci "$kc" || return 2
            security list-keychains -d user -s "$kc" $SEARCH
            security default-keychain -d user -s "$kc"
            cd_a="$(cdhash "$app")"; dr_a="$(dreq "$app")"
            echo "== $name A(쓰기) cdhash=$cd_a dr=$dr_a" >> "$LOG"
            limited 90 env AUTOSAVER_SMOKE_KEYCHAIN=write "$app/Contents/MacOS/Daling" --autosaver-smoke
            rc=$?
            if [ "$rc" = 0 ]; then
              # 항목의 접근 목록: 믿는 앱(요구 조건)과 partition_id(무엇으로 묶였나). 비밀 값은 찍지 않는다(-d 없음)
              limited 30 security dump-keychain -a "$kc"
              if [ "$mode" = next ]; then
                plutil -replace CFBundleVersion -string "persist-next" "$app/Contents/Info.plist"
                codesign --force --timestamp=none "${kc_args[@]}" --sign "$id" "$app" >> "$LOG" 2>&1
              fi
              cd_b="$(cdhash "$app")"; dr_b="$(dreq "$app")"
              echo "== $name B(읽기, $mode) cdhash=$cd_b dr=$dr_b ($([ "$dr_a" = "$dr_b" ] && echo 'DR 같음' || echo 'DR 바뀜'))" >> "$LOG"
              if [ "$mode" = next ] && { [ -z "$cd_b" ] || [ "$cd_a" = "$cd_b" ]; }; then
                echo "cdhash 가 안 바뀌어 '다음 빌드' 가 아닙니다" >> "$LOG"
                rc=3
              else
                limited 90 env AUTOSAVER_SMOKE_KEYCHAIN=read "$app/Contents/MacOS/Daling" --autosaver-smoke
                rc=$?
              fi
            else
              rc=2
            fi
            security default-keychain -d user -s "$OLD_DEFAULT"
            security list-keychains -d user -s $SEARCH
            security delete-keychain "$kc"
            rm -rf "$RUNNER_TEMP/kc-$name"
            return "$rc"
          }
          verdict() {
            case $1 in
              0) echo "묻지 않고 읽음" ;;
              1) echo "못 읽음 (다시 물어야 함)" ;;
              124) echo "멈춤 (묻는 창을 기다린 듯)" ;;
              3) echo "점검 무효 (cdhash 가 안 바뀜)" ;;
              *) echo "점검 준비 실패" ;;
            esac
          }
          persist same "$IDENTITY" same
          SAME=$?
          persist adhoc - next
          ADHOC=$?
          CERT=""
          if [ "$IDENTITY" != "-" ]; then
            persist cert "$IDENTITY" next
            CERT=$?
          fi
          cat "$LOG"
          {
            echo "### 키체인 허락 유지 (다음 빌드가 묻지 않고 읽는가)"
            echo "| 경우 | 결과 |"
            echo "|---|---|"
            echo "| 같은 빌드 그대로 (양성 대조군, 읽어야 정상) | $(verdict "$SAME") |"
            echo "| ad-hoc 다음 빌드 (음성 대조군, 못 읽어야 정상) | $(verdict "$ADHOC") |"
            [ -n "$CERT" ] && echo "| 사설 인증서 다음 빌드 | $(verdict "$CERT") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "같은 빌드: $(verdict "$SAME") · ad-hoc: $(verdict "$ADHOC")${CERT:+ · 사설 인증서: $(verdict "$CERT")}"
          if [ "$SAME" != 0 ]; then
            echo "::error::같은 빌드도 묻는 창을 막고는 못 읽습니다 — 점검 방법이 이 러너에서 안 맞아 결과를 믿을 수 없습니다"
            exit 1
          fi
          if [ "$ADHOC" = 0 ]; then
            echo "::warning::ad-hoc 다음 빌드도 묻지 않고 읽었습니다 — 이 러너에서는 '다시 묻기' 를 못 잡는 것일 수 있어 결과를 믿기 어렵습니다"
          fi
          if [ "$CERT" = 0 ]; then
            echo "::notice::사설 인증서 다음 빌드가 키체인을 묻지 않고 읽었습니다 — 2026-10-15 실측(partition_id cdhash 로 못 읽음)과 달라졌습니다. FEATURES.md 'macOS 판' 을 고치세요"
          elif [ -n "$CERT" ]; then
            echo "::notice::사설 인증서 다음 빌드도 키체인을 다시 묻습니다 ($(verdict "$CERT")): 항목 partition_id 가 cdhash 라서. 알려진 결과(2026-10-15)"
          fi
          exit 0

      - name: 키체인 실험 (keychain_lab)
        # 위 점검이 '사설 인증서로도 다음 빌드는 못 읽는다(partition_id = cdhash)' 고 잰 뒤, 피할 길이 있는지 잰다.
        # 만드는 방법·고치기(mac_keychain_lab.py 머리말)를 바꿔 가며 1판이 만들고 → 2판 → 3판(판 번호만 바꿔 같은
        # 인증서로 다시 서명, 업데이트처럼 .Daling.app.new 에 놓고 바꿔 끼움)이 묻는 창 없이 읽는지 본다.
        # 3판까지 보는 까닭: 2판이 읽으며 제 partition 을 붙이는 식이면 3판에서 다시 막힌다.
        # 결과는 단계 요약 표, 접근 목록(dump-keychain -a, 비밀 값 없음)은 logs/keychain-lab.log.
        if: inputs.keychain_lab && steps.cert.outputs.identity != '-'
        continue-on-error: true
        timeout-minutes: 25
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          SIGN_KC: ${{ steps.cert.outputs.keychain }}
        run: |
          set +e
          mkdir -p logs
          LOG="$PWD/logs/keychain-lab.log"
          DUMP="$RUNNER_TEMP/kc-lab-dump.txt"
          : > "$LOG"
          OLD_DEFAULT="$(security default-keychain -d user | tr -d '" ')"
          SEARCH="$(security list-keychains -d user | tr -d '"')"
          limited() {  # $1 초 안에 안 끝나면 죽이고 124. 출력은 $OUT(기본 $LOG)에 붙인다
            local limit=$1 pid out="${OUT:-$LOG}"
            shift
            "$@" >> "$out" 2>&1 &
            pid=$!
            for _ in $(seq 1 "$limit"); do
              kill -0 "$pid" 2>/dev/null || { wait "$pid"; return $?; }
              sleep 1
            done
            kill -KILL "$pid" 2>/dev/null
            wait "$pid" 2>/dev/null
            return 124
          }
          cdhash() { codesign -dvvv "$1" 2>&1 | sed -n 's/^CDHash=//p'; }
          run_app() {  # $1 앱, $2 단계(write|read|droppart|addpart), $3 만드는 방법, $4 더할 partition
            echo "-- $2${3:+ ($3)}${4:+ $4}" >> "$LOG"
            limited 90 env AUTOSAVER_SMOKE_KEYCHAIN="$2" AUTOSAVER_SMOKE_KEYCHAIN_METHOD="${3:-default}" \
              AUTOSAVER_SMOKE_KEYCHAIN_PARTITION="$4" "$1/Contents/MacOS/Daling" --autosaver-smoke
          }
          acl() {  # $1 키체인, $2 언제 → 로그에 접근 목록, PARTS 에 partition_id 항목 설명 (비밀 값은 안 찍는다: -d 없음)
            : > "$DUMP"
            OUT="$DUMP" limited 30 security dump-keychain -a "$1"
            echo "-- 접근 목록 ($2)" >> "$LOG"
            sed -n '/^access:/,$p' "$DUMP" >> "$LOG"
            PARTS="$(awk '/: partition_id$/{f=1; next} f && /description:/{sub(/^ *description: */, ""); printf "%s%s", (n++ ? " / " : ""), $0; f=0}' "$DUMP")"
            PARTS="${PARTS:-없음}"
          }
          verdict() {
            case $1 in
              0) echo "묻지 않고 읽음" ;; 1) echo "못 읽음" ;; 124) echo "멈춤" ;; *) echo "오류($1)" ;;
            esac
          }
          did() {
            case $1 in
              0) echo "됨" ;; 1) echo "안 됨" ;; 124) echo "멈춤" ;; *) echo "오류($1)" ;;
            esac
          }
          RESULTS=()
          lab() {  # $1 이름, $2 만드는 방법, $3 만든 뒤(none|droppart), $4 업데이트 때(none|prev: 옛 판이 새 판 cdhash 를 더함|self: 새 판이 제 것을 더함)
            local name=$1 method=$2 after=$3 update=$4
            local base="$RUNNER_TEMP/lab-$name" kc="daling-lab-$name.keychain"
            local app="$RUNNER_TEMP/lab-$name/Daling.app" new="$RUNNER_TEMP/lab-$name/.Daling.app.new"
            local row="| $name | $method | $after | $update" rc step gen cd_new
            rm -rf "$base" && mkdir -p "$base" && ditto dist/Daling.app "$app" || { RESULTS+=("$row | 준비 실패 | | | |"); return; }
            security create-keychain -p daling-ci "$kc" && security set-keychain-settings "$kc" \
              && security unlock-keychain -p daling-ci "$kc" || { RESULTS+=("$row | 준비 실패 | | | |"); return; }
            security list-keychains -d user -s "$kc" $SEARCH
            security default-keychain -d user -s "$kc"
            echo "==== $name: 만들기 $method · 만든 뒤 $after · 업데이트 때 $update · 1판 cdhash=$(cdhash "$app")" >> "$LOG"
            run_app "$app" write "$method"
            rc=$?
            if [ "$rc" = 0 ] && [ "$after" = droppart ]; then run_app "$app" droppart; rc=$?; fi
            acl "$kc" "1판이 만든 뒤"
            row="$row | $(did "$rc") | $PARTS"
            # 1판이 못 만들었으면 읽기 결과는 뜻이 없다 ('항목 없음' 을 '못 읽음' 으로 잘못 세지 않게)
            GENS="2 3"
            [ "$rc" = 0 ] || { row="$row | - | -"; GENS=""; }
            for gen in $GENS; do
              rm -rf "$new" && ditto "$app" "$new"
              plutil -replace CFBundleVersion -string "lab-$gen" "$new/Contents/Info.plist"
              codesign --force --timestamp=none --keychain "$SIGN_KC" --sign "$IDENTITY" "$new" >> "$LOG" 2>&1
              cd_new="$(cdhash "$new")"
              echo "== ${gen}판 cdhash=$cd_new dr=$(codesign -d -r- "$new" 2>&1 | sed -n 's/^#* *designated => //p')" >> "$LOG"
              step=""
              if [ "$update" = prev ]; then run_app "$app" addpart "" "cdhash:$cd_new"; step=$?; fi
              rm -rf "$app" && mv "$new" "$app"
              if [ "$update" = self ]; then run_app "$app" addpart "" "cdhash:$cd_new"; step=$?; fi
              run_app "$app" read
              rc=$?
              acl "$kc" "${gen}판 읽은 뒤"
              row="$row | ${step:+고치기 $(did "$step") → }$(verdict "$rc")"
            done
            RESULTS+=("$row |")
            security default-keychain -d user -s "$OLD_DEFAULT"
            security list-keychains -d user -s $SEARCH
            security delete-keychain "$kc"
            rm -rf "$base"
          }
          lab default   default  none     none
          lab access    access   none     none
          lab allowall  allowall none     none
          lab owner     owner    none     none
          lab drop      default  droppart none
          lab ownerdrop owner    droppart none
          lab prev      default  none     prev
          lab ownerprev owner    none     prev
          lab self      default  none     self
          lab ownerself owner    none     self
          cat "$LOG"
          {
            echo "### 키체인 실험 (1판이 만든 항목을 2판·3판이 묻지 않고 읽는가)"
            echo "| 경우 | 만들기 | 만든 뒤 | 업데이트 때 | 1판 쓰기 | 1판 뒤 partition_id | 2판 | 3판 |"
            echo "|---|---|---|---|---|---|---|---|"
            printf '%s\n' "${RESULTS[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: DMG 만들기
        run: |
          DMG="${{ steps.ver.outputs.dmg }}"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # ditto 는 심볼릭 링크(Frameworks↔Resources 교차 링크)·확장 속성·서명을 그대로 옮긴다
          ditto dist/Daling.app "$STAGE/Daling.app"
          # 열면 '응용 프로그램' 으로 끌어다 놓을 수 있게
          ln -s /Applications "$STAGE/Applications"
          # 러너에서 hdiutil 이 가끔 'Resource busy' 로 실패한다. 몇 번 다시 한다
          for i in 1 2 3; do
            hdiutil create -volname "Daling ${{ steps.ver.outputs.version }}" -srcfolder "$STAGE" \
              -fs HFS+ -format UDZO -ov "$DMG" && break
            echo "hdiutil create 실패 ($i) — 다시 합니다"
            sleep 5
          done
          test -f "$DMG"
          hdiutil verify "$DMG"
          # DMG 안의 앱 서명이 온전한지 한 번 더
          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" > /dev/null
          codesign --verify --deep --strict "$MNT/Daling.app"
          hdiutil detach "$MNT" > /dev/null || hdiutil detach -force "$MNT" > /dev/null
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          ls -lh "$DMG"

      - name: 한 줄 설치·앱 안 업데이트 점검
        # 사이트의 'curl -fsSL https://gudaling.dev/install.sh | sh' 와 같은 docs/install.sh 로
        #  1) 지금 릴리스를 /Applications 에 깔고 (curl 은 격리 표시를 붙이지 않는다 → Gatekeeper 창 없음)
        #  2) 그 앱을 켜 둔 채, 앱 안 업데이트(updater._start_mac_install)가 넘기는 환경 변수 그대로 이번 빌드 DMG 로 바꾼다
        # 러너는 관리자 계정이라 /Applications 에 암호 없이 쓸 수 있다 (학생 맥 대부분과 같음)
        timeout-minutes: 10
        run: |
          mkdir -p logs
          APP=/Applications/Daling.app
          V="${{ steps.ver.outputs.version }}"
          health() {  # $1 초 안에 화면 서버가 뜨면 0
            for _ in $(seq 1 "$1"); do
              sleep 1
              for p in $(seq 8765 8785); do
                curl -fsS --max-time 1 "http://127.0.0.1:$p/healthz" 2>/dev/null | grep -q '"mode"' && { echo "port $p"; return 0; }
              done
            done
            return 1
          }
          no_quarantine() {
            if xattr -p com.apple.quarantine "$1" 2>/dev/null; then echo "::error::$1 에 격리 표시가 붙었습니다"; exit 1; fi
          }

          DALING_NO_OPEN=1 sh docs/install.sh 2>&1 | tee logs/install-oneline.log
          test -d "$APP"
          no_quarantine "$APP"
          no_quarantine "$APP/Contents/MacOS/Daling"
          codesign --verify --deep --strict "$APP"
          echo "깐 판: $(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)"
          # Finder 처럼 띄운다. 격리 표시가 없으니 Gatekeeper 창 없이 떠야 한다
          open "$APP"
          health 40 || { echo "::error::한 줄 설치한 앱이 뜨지 않았습니다"; exit 1; }

          cp "${{ steps.ver.outputs.dmg }}" "$RUNNER_TEMP/update.dmg"
          DALING_DMG="$RUNNER_TEMP/update.dmg" DALING_DEST=/Applications DALING_UPDATE=1             sh docs/install.sh 2>&1 | tee logs/install-update.log
          NEW="$(defaults read "$APP/Contents/Info.plist" CFBundleShortVersionString)"
          echo "바꾼 판: $NEW"
          [ "$NEW" = "$V" ] || { echo "::error::업데이트 뒤 판이 $NEW (기대 $V)"; exit 1; }
          test ! -e /Applications/.Daling.app.new && test ! -e /Applications/.Daling.app.old
          test ! -e "$RUNNER_TEMP/update.dmg"
          no_quarantine "$APP"
          codesign --verify --deep --strict "$APP"
          health 40 || { echo "::error::업데이트한 앱이 다시 뜨지 않았습니다"; exit 1; }
          pkill -f "Daling.app/Contents/MacOS/Daling" || true

      - name: 서명 키체인 지우기
        # 개인 키가 든 임시 키체인. GitHub 러너는 끝나면 버려지지만, 자체 러너로 옮겨도 남지 않게
        if: always() && steps.cert.outputs.keychain != ''
        run: security delete-keychain "${{ steps.cert.outputs.keychain }}" || true

      - name: 빌드 출처 증명 (Sigstore)
        # 맥 판은 공증이 없어(유료 Apple 개발자 계정 필요) 받은 DMG 가 진짜인지 macOS 가 확인해 주지 않는다.
        # 대신 '이 저장소의 이 워크플로가 만든 파일' 임을 공개 기록에 남긴다 (공개 저장소는 무료).
        # 확인: gh attestation verify daling-<버전>-mac-arm64.dmg -R tutleblue/dgist-lms-autosaver
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ver.outputs.dmg }}

      - name: DMG 보관
        uses: actions/upload-artifact@v4
        with:
          name: daling-mac-dmg
          path: |
            ${{ steps.ver.outputs.dmg }}
            ${{ steps.ver.outputs.dmg }}.sha256
          if-no-files-found: error

      - name: 로그·스크린샷 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daling-mac-logs
          path: |
            logs/
            build/daling-mac/warn-daling-mac.txt
          if-no-files-found: ignore
